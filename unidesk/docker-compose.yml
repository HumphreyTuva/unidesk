# Local development database only. In production the database is Neon.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: unidesk
      POSTGRES_PASSWORD: unidesk
      POSTGRES_DB: unidesk
    ports: ["5433:5432"] # 5433 so it never clashes with a PostgreSQL already installed on your computer
    volumes: [pg:/var/lib/postgresql/data]
volumes:
  pg: {}
